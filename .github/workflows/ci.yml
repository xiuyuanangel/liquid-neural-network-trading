name: LNN Trading CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Trading Pair (e.g. BTC-USDT)'
        required: false
        default: 'BTC-USDT'
      days:
        description: 'Training data days'
        required: false
        default: '60'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  train-model:
    runs-on: ubuntu-latest
    needs: test
    # 在 push 到 main/master 分支、定时任务或手动触发时运行
    if: |
      always() && 
      (github.event_name == 'schedule' || 
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Cache market data
      uses: actions/cache@v4
      with:
        path: ./data/cache
        key: market-data-${{ github.run_id }}
        restore-keys: |
          market-data-

    - name: Train model
      run: |
        python src/main.py \
          --symbol ${{ github.event.inputs.symbol || 'BTC-USDT' }} \
          --days ${{ github.event.inputs.days || '60' }} \
          --mode train

    - name: Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-model-${{ github.run_id }}
        path: |
          models/
          logs/
        retention-days: 30

  predict:
    runs-on: ubuntu-latest
    needs: train-model
    # 只在手动触发时运行预测任务
    if: github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download model artifacts
      uses: actions/download-artifact@v4
      with:
        name: trained-model-${{ github.run_id }}
        path: ./

    - name: Run prediction
      run: |
        python src/main.py \
          --symbol ${{ github.event.inputs.symbol || 'BTC-USDT' }} \
          --mode predict
